name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # The project is developed on Windows; keep one job honest about it.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Validate the catalog
        # Cycles, dangling references and unteachable skills fail here, before
        # a single test runs.
        run: python -c "from backend.catalog import get_catalog; c = get_catalog(); print(len(c.skills), 'skills', len(c.items), 'items', len(c.goals), 'goals')"

      - name: Tests
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t learning-path-recommender:ci .

      - name: Boot it and check /api/health
        run: |
          docker run -d --name lpr -p 8000:8000 learning-path-recommender:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          echo "the container never became healthy" >&2
          docker logs lpr >&2
          exit 1
