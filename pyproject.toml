[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rungs"
version = "1.0.0"
description = "Prerequisite-ordered, explainable learning paths generated from a goal stated in plain language."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vangara Yaswanth Sai", email = "yaswanthsaivangara95@gmail.com" }]
license = { file = "LICENSE" }
keywords = ["learning-path", "recommender", "fastapi", "education", "llm"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
# The provider layer is stdlib urllib, so no provider needs a package. Install
# this only to use Anthropic's own SDK path in backend/llm.py.
anthropic = ["anthropic>=0.40,<1.0"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
rungs = "run:main"

[tool.setuptools]
packages = ["backend"]

[tool.setuptools.package-data]
backend = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = []

[tool.coverage.run]
source = ["backend"]
branch = true

[tool.coverage.report]
# The engines are the substance; a missed line there matters.
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 90
target-version = "py310"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
]
ignore = [
    "E501",   # line length is handled by the formatter, not enforced hard
    "B008",   # FastAPI's Depends(...) defaults are the framework's idiom
    "UP045",  # the codebase spells optionals `Optional[X]` throughout; house style
]

[tool.ruff.lint.isort]
# Keep `from . import (assistant, dashboard as dashboard_engine, ...)` in one block.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Tests set environment variables before importing the app on purpose.
"tests/conftest.py" = ["E402"]
