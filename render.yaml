# Render blueprint — one-click deploy of the Docker image.
#
#   1. Push this repository to GitHub.
#   2. render.com → New → Blueprint → pick the repo. Render reads this file.
#   3. Set GEMINI_API_KEY in the dashboard when prompted (or leave it blank —
#      the app runs fine on its rule engine without any provider).
#
# The free instance type has no persistent disk and sleeps after 15 minutes of
# inactivity, so the first request after a sleep takes ~50 seconds. Set
# DATABASE_URL to a managed Postgres (Neon's free tier is enough) and the data
# outlives the instance — without it, accounts and paths are erased on every
# wake, which is fine for a throwaway demo and not fine for anything else.
services:
  - type: web
    name: rungs
    runtime: docker
    plan: free
    # Match the region your DATABASE_URL points at. The database is in
    # us-east-2, and serving from Singapore put a cross-planet round trip
    # on every query — page loads went from ~200ms to over seven seconds.
    region: ohio
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Only used when DATABASE_URL is unset; the file is erased on each wake.
      - key: LEARNING_DB_PATH
        value: /tmp/learning.db
      # Managed Postgres, so accounts survive a sleep. Paste the pooled
      # connection string at deploy time; leave it blank to run on SQLite.
      - key: DATABASE_URL
        sync: false
      # Render serves the app over HTTPS, so the session cookie can be Secure.
      - key: COOKIE_SECURE
        value: "1"
      # Prompted for at deploy time and never stored in the repository.
      - key: GEMINI_API_KEY
        sync: false
      # Password reset mail. Brevo's HTTP API, not SMTP: Render's free tier
      # blocks outbound traffic to ports 25, 465 and 587, so an SMTP transport
      # would work locally and time out here. Leave unset to disable reset.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Rungs
      # Optional. Reset links fall back to RENDER_EXTERNAL_URL, which Render
      # injects with this service's own https:// address — so the first deploy
      # already mails working links. Set this only for a custom domain, where
      # Render's value would still name the onrender host.
      - key: PUBLIC_BASE_URL
        sync: false
      # Lock this to your own origin once the URL is known.
      - key: ALLOWED_ORIGINS
        value: "*"
      # A public demo is worth rate limiting harder than a local run.
      - key: RATE_LIMIT_CHAT_PER_MINUTE
        value: "10"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
      # Render terminates TLS in front of the app, so the caller IP arrives in
      # X-Forwarded-For; without this the limiter would see one proxy address.
      - key: TRUST_PROXY_HEADER
        value: "1"
